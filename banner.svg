<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#0d0d0d"/>

  <!-- left half: organic neural waveform -->
  <g stroke="#e5e5e5" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0,110 C40,60 70,160 110,110 C150,60 180,160 220,110 C260,60 290,160 330,110 C370,60 400,150 440,110 C470,80 500,130 540,110" />
  </g>
  <g fill="#e5e5e5">
    <circle cx="40" cy="85" r="3"/>
    <circle cx="110" cy="110" r="3"/>
    <circle cx="180" cy="135" r="3"/>
    <circle cx="260" cy="85" r="3"/>
    <circle cx="330" cy="110" r="3"/>
    <circle cx="400" cy="130" r="3"/>
  </g>

  <!-- transition zone: waveform breaking into grid -->
  <g stroke="#8a8a8a" stroke-width="1.5" opacity="0.7">
    <line x1="560" y1="60" x2="560" y2="160"/>
    <line x1="600" y1="50" x2="600" y2="170"/>
    <line x1="640" y1="70" x2="640" y2="150"/>
    <line x1="680" y1="55" x2="680" y2="165"/>
  </g>

  <!-- right half: computed grid / pixel structure -->
  <g stroke="#e5e5e5" stroke-width="1.2" opacity="0.85">
    <line x1="740" y1="60" x2="1160" y2="60"/>
    <line x1="740" y1="90" x2="1160" y2="90"/>
    <line x1="740" y1="120" x2="1160" y2="120"/>
    <line x1="740" y1="150" x2="1160" y2="150"/>
    <line x1="760" y1="40" x2="760" y2="170"/>
    <line x1="820" y1="40" x2="820" y2="170"/>
    <line x1="880" y1="40" x2="880" y2="170"/>
    <line x1="940" y1="40" x2="940" y2="170"/>
    <line x1="1000" y1="40" x2="1000" y2="170"/>
    <line x1="1060" y1="40" x2="1060" y2="170"/>
    <line x1="1120" y1="40" x2="1120" y2="170"/>
  </g>
  <g fill="#ffffff">
    <rect x="815" y="55" width="10" height="10"/>
    <rect x="935" y="85" width="10" height="10"/>
    <rect x="1055" y="115" width="10" height="10"/>
    <rect x="875" y="145" width="10" height="10"/>
  </g>
</svg>
